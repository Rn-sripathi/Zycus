services:
  - type: web
    name: zycus-redline-agent
    runtime: python
    region: oregon
    plan: free
    # The React bundle is built into backend/app/static, so one service serves
    # both the API and the UI from a single origin.
    # The React bundle is committed, so the build needs only Python. If the image
    # happens to provide Node, the bundle is rebuilt from source; if not, the
    # committed one is served and the deploy still succeeds.
    buildCommand: |
      cd backend && pip install -r requirements.txt
      cd ../frontend && if command -v npm >/dev/null 2>&1; then npm ci && npm run build; else echo "npm unavailable - serving the committed bundle"; fi
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false # set in the Render dashboard, never committed
      - key: DATABASE_URL
        sync: false # Neon connection string, set in the dashboard
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: NODE_VERSION
        value: "20.18.0"
    healthCheckPath: /api/health
